[package]
name = "learnvault-core"
description = "Domínio do LearnVault: bibliotecas, catálogo, identidade de mídia e estado de estudo."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
thiserror = "2"
uuid = { version = "1.28", features = ["v7"] }
walkdir = "2.5"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
