[package]
name = "learnvault-core"
description = "Domínio do LearnVault: bibliotecas, catálogo, identidade de mídia e estado de estudo."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
rusqlite_migration = "2.6"
rustix = { version = "1.1.5", features = ["fs"] }
thiserror = "2"
uuid = { version = "1.28", features = ["v5", "v7"] }
walkdir = "2.5"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
cap-std = "4.0.3"
