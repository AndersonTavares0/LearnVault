[package]
name = "learnvault-core"
description = "Domínio do LearnVault: bibliotecas, catálogo, identidade de mídia e estado de estudo."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tempfile = "3"
rusqlite = { version = "0.41", features = ["backup", "bundled"] }
thiserror = "2"
uuid = { version = "1.28", features = ["v5", "v7"] }
walkdir = "2.5"

[dev-dependencies]
rusqlite = { version = "0.41", features = ["backup", "bundled"] }
tempfile = "3"
