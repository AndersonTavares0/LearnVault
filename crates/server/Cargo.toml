[package]
name = "learnvault-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8"
argon2 = "0.6"
base64 = "0.23"
getrandom = "0.4"
learnvault-core = { path = "../core" }
# Filesystem events back automatic indexing on inotify/FSEvents/ReadDirectoryChangesW.
# Periodic reconciliation remains the portable fallback, so a watcher that cannot start
# only degrades freshness, never correctness. `walkdir` is already in the dependency tree
# through `learnvault-core`; `notify` is the only new direct dependency.
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.11"
# Asynchronous HTTP client only for the update check (fixed HTTPS to the
# GitHub API). Without `default-features` so as not to bring in OpenSSL nor the
# `aws-lc-rs` cryptography provider (which would require CMake); the `ring` provider is installed by the
# `update` module itself. Smallest possible surface: only the rustls backend.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Encryption of remote-source credentials at rest (ChaCha20-Poly1305). `ring`
# already comes in through the rustls chain; declaring it directly only exposes the AEAD API.
ring = "0.17"
quick-xml = "0.42"
# Reading the PROPFIND's `getlastmodified`, which comes as an RFC 1123 date. The crate was already
# in the dependency tree; declaring it directly only exposes the parser.
httpdate = "1"
# Pure-Rust SMB2/3 client for the SMB course sources. No Kerberos or NetBIOS:
# the source uses TCP/445 with NTLM, signing and SMB3 encryption when the server requires it.
smb = { version = "0.12.1", default-features = false, features = ["async", "sign", "encrypt"] }
url = "2.5"
percent-encoding = "2.3"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["timeout", "util"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
