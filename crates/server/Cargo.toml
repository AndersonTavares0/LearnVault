[package]
name = "learnvault-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8"
argon2 = "0.6"
base64 = "0.23"
getrandom = "0.4"
learnvault-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.11"
# Cliente HTTP assíncrono somente para a verificação de atualização (HTTPS fixo para a
# API do GitHub). Sem `default-features` para não trazer OpenSSL nem o provedor de
# criptografia `aws-lc-rs` (que exigiria CMake); o provedor `ring` é instalado pelo
# próprio módulo `update`. Menor superfície possível: só o backend rustls.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["timeout", "util"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
