[package]
name = "learnvault-desktop"
description = "LearnVault desktop application: offline Tauri 2 webview, no network ports."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# The desktop crate exists to embed the SPA and talk to the core over IPC. It never
# opens network sockets nor embeds an HTTP server.
#
# `learnvault-core` came in with the domain integration: the desktop derives the catalog, the
# rescan summary and the study progress from the same core the server uses, without
# duplicating rules. The IPC exposes the configuration, the selection of the library root, the catalog,
# the explicit rescan and the study progress of the fixed local owner; media and authentication
# belong to later slices.
#
# `tauri-plugin-dialog` provides the native directory picker used **internally in
# Rust**. It is not granted to the webview in `capabilities/`, so it exposes neither a dialog nor
# the file system to the SPA.
# `tauri-plugin-updater` provides the official check and installation of signed updates
# (Ed25519) through GitHub Releases on Windows/Desktop.

[dependencies]
# Tauri 2.12.x. The Tauri crates do not share the minor number: `tauri` is at
# 2.12.4 and `tauri-build` at 2.7.3, which is the newest build version of the 2 line.
# The resolved versions are pinned in the workspace's `Cargo.lock`. The Tauri CLI
# manages the `features` list according to `tauri.conf.json` on every `tauri dev`/`tauri build`;
# keeping it explicit prevents the manifest from being rewritten on the first `pnpm dev:tauri`.
tauri = { version = "2.12.4", features = [] }
tauri-plugin-updater = "2"
# Shared core: catalog and the domain's SQLite database.
learnvault-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
# Serialization of the versioned configuration of the library root.
serde_json = "1"
# The desktop's HTTP client to sync with the local server. Same features as the
# server's: no native TLS/OpenSSL, with the `ring` provider installed in process. No
# redirects and with a per-request timeout.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dev-dependencies]
# The integration tests build in-memory and temporary databases through the core.
learnvault-core = { path = "../core" }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
# On Linux, the picker uses the official portal and does not require broad access to the sandbox's file system.
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# Windows and macOS keep the current native backend (the GTK feature has no effect on them).
tauri-plugin-dialog = "2"
