# LearnVault - local image build (for contributors)
# compose.yaml uses the image published on GHCR. This file replaces it with an image
# built from the source code:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
services:
  learnvault:
    build:
      context: ../..
      dockerfile: deploy/container/Containerfile
    image: learnvault-rust:local
