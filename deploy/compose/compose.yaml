# Este arquivo constrói o servidor Rust com `Containerfile`. O tarball Rust é o release suportado.
# Nunca aponte `DATA_DIR` para um
# banco Go v7/v8 não migrado: o Rust falha fechado; migre antes com `learnvault-server migrate-go`.
services:
  learnvault:
    build:
      context: ../..
      dockerfile: deploy/container/Containerfile
    image: learnvault-rust:local
    container_name: learnvault
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ${LISTEN_ADDR:-0.0.0.0}
      PORT: ${PORT:-8090}
      DATA_DIR: /data
      CACHE_DIR: /cache
      LIBRARY_DIR: /library
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "${PORT:-8090}:${PORT:-8090}"
    volumes:
      - ${DATA_DIR:-../../data}:/data:rw
      - ${CACHE_DIR:-../../cache}:/cache:rw
      - ${LIBRARY_DIR:-../../testdata/library}:/library:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${PORT}/api/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
