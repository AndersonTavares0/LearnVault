# LearnVault - Docker Compose para Self-Hosting
# Imagem oficial OCI minimalista, segura e não-root (UID 10001).
# A pasta de cursos (/library) é montada estritamente como somente leitura (:ro).
services:
  learnvault:
    build:
      context: ../..
      dockerfile: deploy/container/Containerfile
    image: ${LEARNVAULT_IMAGE:-learnvault-rust:local}
    container_name: learnvault
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ${LISTEN_ADDR:-0.0.0.0}
      PORT: ${PORT:-8090}
      DATA_DIR: /data
      CACHE_DIR: /cache
      LIBRARY_DIR: /library
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8090}:${PORT:-8090}"
    volumes:
      - ${DATA_DIR:-../../data}:/data:rw
      - ${CACHE_DIR:-../../cache}:/cache:rw
      - ${LIBRARY_DIR:-../../testdata/library}:/library:ro
    networks:
      - learnvault_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${PORT}/api/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  learnvault_net:
    driver: bridge
