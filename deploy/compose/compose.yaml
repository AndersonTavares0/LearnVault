# LearnVault - Docker Compose for self-hosting
# Official minimal, secure, non-root OCI image (UID 10001), published on GHCR.
# To build the image from the source code, add compose.build.yaml (see deploy/README.md).
# The course folder (/library) is mounted strictly read-only (:ro).
services:
  learnvault:
    image: ${LEARNVAULT_IMAGE:-ghcr.io/andersontavares0/learnvault:latest}
    container_name: learnvault
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      LISTEN_ADDR: ${LISTEN_ADDR:-0.0.0.0}
      PORT: ${PORT:-8090}
      DATA_DIR: /data
      CACHE_DIR: /cache
      LIBRARY_DIR: /library
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8090}:${PORT:-8090}"
    volumes:
      - ${DATA_DIR:-../../data}:/data:rw
      - ${CACHE_DIR:-../../cache}:/cache:rw
      - ${LIBRARY_DIR:-../../testdata/library}:/library:ro
    networks:
      - learnvault_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${PORT}/api/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  learnvault_net:
    driver: bridge
