services:
  learnvault:
    environment:
      ADMIN_USERNAME: ""
      ADMIN_PASSWORD: ""
      ADMIN_USERNAME_FILE: /run/secrets/admin_username
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - admin_username
      - admin_password

secrets:
  admin_username:
    file: ./secrets/admin_username
  admin_password:
    file: ./secrets/admin_password
