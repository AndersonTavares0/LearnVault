<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f" />
      <stop offset="50%" stop-color="#0c121c" />
      <stop offset="100%" stop-color="#06080d" />
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.16" />
      <stop offset="45%" stop-color="#10b981" stop-opacity="0.08" />
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#1e293b" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d5e4a" />
      <stop offset="45%" stop-color="#263f31" />
      <stop offset="100%" stop-color="#14231b" />
    </linearGradient>

    <linearGradient id="shieldFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.45" />
    </pattern>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />
  <rect width="1200" height="360" rx="16" fill="url(#ambientGlow)" />

  <!-- Concentric Vault Reticles -->
  <circle cx="600" cy="120" r="160" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 8" opacity="0.45" />
  <circle cx="600" cy="120" r="230" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 10" opacity="0.25" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Centerpiece Lockup -->
  <g transform="translate(600, 115)" text-anchor="middle">
    
    <!-- Exact Official Brand.svelte Shield & Monogram (Scaled 2.6x) -->
    <g transform="translate(0, -22)" filter="url(#dropShadow)">
      <!-- Outer Hexagonal Faceted Shield -->
      <polygon points="0,-43.68 42.9,-20.28 42.9,20.28 0,43.68 -42.9,20.28 -42.9,-20.28" fill="url(#shieldGrad)" stroke="#4d755d" stroke-width="1.8" />
      
      <!-- Facet Lighting -->
      <polygon points="0,-43.68 0,43.68 -42.9,20.28 -42.9,-20.28" fill="url(#shieldFacetLeft)" />
      <polygon points="0,-43.68 42.9,-20.28 42.9,20.28 0,43.68" fill="#000000" fill-opacity="0.12" />
      
      <!-- Inner Bevel Line -->
      <polygon points="0,-38 37,-17.5 37,17.5 0,38 -37,17.5 -37,-17.5" fill="none" stroke="#6fa584" stroke-width="0.9" opacity="0.4" />

      <!-- Monogram 'LV' (Exact Brand.svelte proportions scaled 2.6x) -->
      <g fill="#ffffff">
        <!-- L -->
        <path d="M-19.5,-19.5 h8.32 v30.68 h11.7 v7.8 h-20.02 Z" />
        <!-- V -->
        <path d="M4.42,-19.5 h8.84 l8.06 25.48 8.06 -25.48 h8.84 l-12.48 38.48 h-8.84 Z" />
      </g>
    </g>

    <!-- Wordmark -->
    <text class="font-sans" y="88" font-size="42" font-weight="800" fill="#f8fafc" letter-spacing="-0.035em">LearnVault</text>

    <!-- Subtitle -->
    <text class="font-sans" y="122" font-size="16" font-weight="500" fill="#cbd5e1" letter-spacing="-0.01em">Self-Hosted Course Library &amp; Offline Study Workspace</text>

    <!-- Technical Badges Row (Centered, Clean Vector Pills) -->
    <g transform="translate(0, 166)">
      <!-- Pill 1: Read-Only Storage -->
      <g transform="translate(-335, 0)">
        <rect x="0" y="0" width="150" height="28" rx="7" fill="#111722" stroke="#1e293b" stroke-width="1" />
        <circle cx="16" cy="14" r="4" fill="#10b981" />
        <text class="font-sans" x="28" y="18" text-anchor="start" font-size="11.5" font-weight="600" fill="#e2e8f0">Read-Only Library</text>
      </g>

      <!-- Pill 2: 100% Offline -->
      <g transform="translate(-170, 0)">
        <rect x="0" y="0" width="140" height="28" rx="7" fill="#111722" stroke="#1e293b" stroke-width="1" />
        <circle cx="16" cy="14" r="4" fill="#38bdf8" />
        <text class="font-sans" x="28" y="18" text-anchor="start" font-size="11.5" font-weight="600" fill="#e2e8f0">100% Offline</text>
      </g>

      <!-- Pill 3: Local SQLite -->
      <g transform="translate(-15, 0)">
        <rect x="0" y="0" width="124" height="28" rx="7" fill="#111722" stroke="#1e293b" stroke-width="1" />
        <circle cx="16" cy="14" r="4" fill="#f59e0b" />
        <text class="font-sans" x="28" y="18" text-anchor="start" font-size="11.5" font-weight="600" fill="#e2e8f0">Local SQLite</text>
      </g>

      <!-- Pill 4: Rust & Svelte 5 -->
      <g transform="translate(124, 0)">
        <rect x="0" y="0" width="210" height="28" rx="7" fill="#111722" stroke="#1e293b" stroke-width="1" />
        <circle cx="16" cy="14" r="4" fill="#a855f7" />
        <text class="font-sans" x="28" y="18" text-anchor="start" font-size="11.5" font-weight="600" fill="#e2e8f0">Rust 2024 • Svelte 5 • Tauri 2</text>
      </g>
    </g>

  </g>
</svg>
