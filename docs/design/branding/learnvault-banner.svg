<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c12" />
      <stop offset="50%" stop-color="#0e1520" />
      <stop offset="100%" stop-color="#06090e" />
    </linearGradient>

    <radialGradient id="glow-amber" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-blue" cx="80%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f493d" />
      <stop offset="100%" stop-color="#192b23" />
    </linearGradient>

    <filter id="mark-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", system-ui, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Consolas, monospace; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="14" fill="url(#bg)" />
  <rect width="1200" height="320" rx="14" fill="url(#grid)" />
  <rect width="1200" height="320" rx="14" fill="url(#glow-amber)" />
  <rect width="1200" height="320" rx="14" fill="url(#glow-blue)" />
  <rect x="1" y="1" width="1198" height="318" rx="13" fill="none" stroke="url(#border)" stroke-width="1.2" />

  <!-- Center Brand Presentation -->
  <g transform="translate(600, 140)" text-anchor="middle">
    
    <!-- Geometric Shield Mark -->
    <g transform="translate(0, -72)" filter="url(#mark-shadow)">
      <!-- Hexagonal Faceted Shield (From Brand.svelte) -->
      <path d="M0 -34.8 L29.7 -18.6 V13.8 L0 30 L-29.7 13.8 V-18.6 Z" fill="url(#shield)" stroke="#4b735e" stroke-width="1.5" />
      <!-- Inner Monogram LV -->
      <path d="M-12.6 -12.6 h5.04 v18.58 h7.09 v4.73 h-12.13 V-12.6 Z M1.89 -12.6 h5.36 l4.88 15.44 4.88 -15.44 h5.36 l-7.56 23.31 h-5.36 L1.89 -12.6 Z" fill="#ffffff" />
    </g>

    <!-- Wordmark -->
    <text class="font-sans" y="24" font-size="38" font-weight="700" fill="#f8fafc" letter-spacing="-0.03em">LearnVault</text>

    <!-- Core Tagline -->
    <text class="font-sans" y="54" font-size="15" font-weight="500" fill="#cbd5e1" letter-spacing="-0.01em">Self-Hosted Course Library &amp; Offline Study Workspace</text>

    <!-- Technical System Bar -->
    <g transform="translate(0, 92)">
      <!-- Technical Pill Elements -->
      <g transform="translate(-315, 0)">
        <rect x="0" y="0" width="105" height="26" rx="6" fill="#111722" stroke="#1e293b" stroke-width="1" />
        <text class="font-mono" x="52.5" y="17" font-size="11" font-weight="600" fill="#94a3b8">Rust &amp; Axum</text>
      </g>
      
      <g transform="translate(-195, 0)">
        <rect x="0" y="0" width="85" height="26" rx="6" fill="#111722" stroke="#1e293b" stroke-width="1" />
        <text class="font-mono" x="42.5" y="17" font-size="11" font-weight="600" fill="#94a3b8">Svelte 5</text>
      </g>

      <g transform="translate(-95, 0)">
        <rect x="0" y="0" width="80" height="26" rx="6" fill="#111722" stroke="#1e293b" stroke-width="1" />
        <text class="font-mono" x="40" y="17" font-size="11" font-weight="600" fill="#94a3b8">Tauri 2</text>
      </g>

      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="75" height="26" rx="6" fill="#111722" stroke="#1e293b" stroke-width="1" />
        <text class="font-mono" x="37.5" y="17" font-size="11" font-weight="600" fill="#94a3b8">SQLite</text>
      </g>

      <g transform="translate(90, 0)">
        <rect x="0" y="0" width="105" height="26" rx="6" fill="#111722" stroke="#1e293b" stroke-width="1" />
        <text class="font-mono" x="52.5" y="17" font-size="11" font-weight="600" fill="#10b981">Read-Only FS</text>
      </g>

      <g transform="translate(210, 0)">
        <rect x="0" y="0" width="105" height="26" rx="6" fill="#111722" stroke="#1e293b" stroke-width="1" />
        <text class="font-mono" x="52.5" y="17" font-size="11" font-weight="600" fill="#f59e0b">Offline Ready</text>
      </g>
    </g>

  </g>
</svg>
