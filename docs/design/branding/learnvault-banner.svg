<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c12" />
      <stop offset="45%" stop-color="#0d141e" />
      <stop offset="100%" stop-color="#06090e" />
    </linearGradient>

    <radialGradient id="amberAura" cx="18%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blueAura" cx="84%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emeraldAura" cx="50%" cy="85%" r="42%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="outerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.75" />
      <stop offset="30%" stop-color="#1e293b" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3" />
    </linearGradient>

    <!-- Bento Card Styles -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131c28" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0e1520" stop-opacity="0.94" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a5948" />
      <stop offset="50%" stop-color="#243c2f" />
      <stop offset="100%" stop-color="#13231a" />
    </linearGradient>

    <!-- Filters -->
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Dot Pattern -->
    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2a3b4e" opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Consolas, monospace; }
  </style>

  <!-- Background Layers -->
  <rect width="1200" height="480" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="480" rx="16" fill="url(#dotPattern)" />
  <rect width="1200" height="480" rx="16" fill="url(#amberAura)" />
  <rect width="1200" height="480" rx="16" fill="url(#blueAura)" />
  <rect width="1200" height="480" rx="16" fill="url(#emeraldAura)" />
  <rect x="1" y="1" width="1198" height="478" rx="15" fill="none" stroke="url(#outerBorder)" stroke-width="1.2" />

  <!-- ==================== LEFT COLUMN: BRAND LOCKUP ==================== -->
  <g transform="translate(68, 60)">
    
    <!-- Shield Logo + Wordmark Header -->
    <g transform="translate(0, 0)">
      <!-- Official Shield Mark -->
      <g filter="url(#markShadow)">
        <path d="M36 5.76 65.7 21.96v28.08L36 66.24 6.3 50.04V21.96L36 5.76Z" fill="url(#shieldGrad)" stroke="#4e735e" stroke-width="1.5" />
        <path d="M36 7.5 64 22.8v26.4L36 64.5 8 49.2V22.8L36 7.5Z" fill="none" stroke="#689d81" stroke-width="1" opacity="0.3" />
        <path d="M22.5 22.5h5.76v21.24h8.1v5.4h-13.86V22.5Zm16.56 0h6.12l5.58 17.64 5.58-17.64h6.12l-8.64 26.64h-6.12L39.06 22.5Z" fill="#ffffff" />
      </g>

      <!-- Brand Title Lockup -->
      <g transform="translate(88, 8)">
        <text class="font-sans" font-size="42" font-weight="800" fill="#f8fafc" letter-spacing="-0.035em">LearnVault</text>
        <!-- Version Badge -->
        <g transform="translate(236, -26)">
          <rect x="0" y="0" width="80" height="22" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
          <text class="font-mono" x="40" y="15" text-anchor="middle" font-size="11" font-weight="600" fill="#fbbf24">v0.8.1</text>
        </g>
        <text class="font-sans" x="0" y="28" font-size="16" font-weight="600" fill="#f59e0b" letter-spacing="-0.01em">Self-Hosted Course Library &amp; Offline Study Space</text>
      </g>
    </g>

    <!-- Value Proposition -->
    <g transform="translate(0, 118)">
      <text class="font-sans" font-size="14.5" fill="#94a3b8">
        <tspan x="0" y="0">Organize course media directly on disk with zero file mutations.</tspan>
        <tspan x="0" y="24">Take timestamped markdown notes, review spaced repetition flashcards,</tspan>
        <tspan x="0" y="48">and run offline-safe focus timers without cloud lock-in.</tspan>
      </text>
    </g>

    <!-- Architectural Guarantees (Clean Vector Pills) -->
    <g transform="translate(0, 212)">
      <!-- Pill 1: Read-Only Scanner -->
      <g transform="translate(0, 0)">
        <rect width="186" height="34" rx="8" fill="#111722" stroke="#1c2736" stroke-width="1" />
        <circle cx="16" cy="17" r="4.5" fill="#10b981" />
        <text class="font-sans" x="29" y="21.5" font-size="12" font-weight="600" fill="#e2e8f0">Read-Only Disk Scanner</text>
      </g>

      <!-- Pill 2: 100% Offline -->
      <g transform="translate(196, 0)">
        <rect width="176" height="34" rx="8" fill="#111722" stroke="#1c2736" stroke-width="1" />
        <circle cx="16" cy="17" r="4.5" fill="#38bdf8" />
        <text class="font-sans" x="29" y="21.5" font-size="12" font-weight="600" fill="#e2e8f0">100% Offline &amp; Private</text>
      </g>

      <!-- Pill 3: Local SQLite -->
      <g transform="translate(382, 0)">
        <rect width="124" height="34" rx="8" fill="#111722" stroke="#1c2736" stroke-width="1" />
        <circle cx="16" cy="17" r="4.5" fill="#f59e0b" />
        <text class="font-sans" x="29" y="21.5" font-size="12" font-weight="600" fill="#e2e8f0">Local SQLite</text>
      </g>
    </g>

    <!-- Architecture & Stack Bar -->
    <g transform="translate(0, 276)">
      <text class="font-mono" x="0" y="14" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.08em">TECH STACK</text>
      
      <g transform="translate(86, 0)">
        <rect x="0" y="0" width="84" height="22" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <text class="font-mono" x="42" y="15" text-anchor="middle" font-size="11" fill="#cbd5e1">Rust 2024</text>

        <rect x="92" y="0" width="56" height="22" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <text class="font-mono" x="120" y="15" text-anchor="middle" font-size="11" fill="#cbd5e1">Axum</text>

        <rect x="156" y="0" width="76" height="22" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <text class="font-mono" x="194" y="15" text-anchor="middle" font-size="11" fill="#cbd5e1">Svelte 5</text>

        <rect x="240" y="0" width="68" height="22" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <text class="font-mono" x="274" y="15" text-anchor="middle" font-size="11" fill="#cbd5e1">Tauri 2</text>

        <rect x="316" y="0" width="92" height="22" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <text class="font-mono" x="362" y="15" text-anchor="middle" font-size="11" fill="#cbd5e1">TypeScript</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: BENTO UI SHOWCASE ==================== -->
  <g transform="translate(636, 48)" filter="url(#cardShadow)">

    <!-- CARD 1: Video Player & Timestamp Scrubbing (Top Bento) -->
    <g transform="translate(0, 0)">
      <rect width="500" height="162" rx="12" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" />
      
      <!-- Video Window Header -->
      <g transform="translate(18, 18)">
        <circle cx="0" cy="0" r="4.5" fill="#ef4444" opacity="0.8" />
        <circle cx="14" cy="0" r="4.5" fill="#f59e0b" opacity="0.8" />
        <circle cx="28" cy="0" r="4.5" fill="#10b981" opacity="0.8" />

        <text class="font-sans" x="48" y="4" font-size="12" font-weight="600" fill="#f1f5f9">Distributed Systems • Lesson 04: Raft Consensus</text>
        <rect x="412" y="-10" width="46" height="20" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <text class="font-mono" x="435" y="4" text-anchor="middle" font-size="10" font-weight="600" fill="#38bdf8">1.25x</text>
      </g>

      <!-- Video Canvas Area -->
      <g transform="translate(18, 44)">
        <rect width="464" height="54" rx="8" fill="#080c12" stroke="#1c2736" stroke-width="1" />
        
        <!-- Vector Play Button -->
        <circle cx="34" cy="27" r="14" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="1" />
        <polygon points="31,21 40,27 31,33" fill="#f59e0b" />
        
        <text class="font-mono" x="62" y="24" font-size="12" font-weight="600" fill="#e2e8f0">Leader Election &amp; Heartbeat RPCs</text>
        <text class="font-mono" x="62" y="39" font-size="10" fill="#64748b">term: 4 • state: Follower to Candidate</text>

        <!-- Vector Bookmark Note Tag (No emoji!) -->
        <g transform="translate(362, 16)">
          <rect width="90" height="22" rx="5" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
          <!-- Vector Bookmark Icon -->
          <path d="M12 5 v11 l4 -3 l4 3 v-11 Z" fill="#34d399" />
          <text class="font-mono" x="25" y="15" font-size="10" font-weight="600" fill="#34d399">[14:32] Note</text>
        </g>
      </g>

      <!-- Timeline Scrub Bar -->
      <g transform="translate(18, 122)">
        <rect width="464" height="6" rx="3" fill="#1e293b" />
        <rect width="194" height="6" rx="3" fill="url(#amberAccent)" />
        <circle cx="194" cy="3" r="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />

        <text class="font-mono" x="0" y="22" font-size="11" font-weight="500" fill="#94a3b8">14:32</text>
        <text class="font-mono" x="464" y="22" text-anchor="end" font-size="11" font-weight="500" fill="#64748b">34:10</text>
      </g>
    </g>

    <!-- BENTO ROW 2: Spaced Repetition + Focus Session -->
    <g transform="translate(0, 178)">
      
      <!-- CARD 2A: Spaced Repetition SM-2 (Bottom Left Bento) -->
      <g transform="translate(0, 0)">
        <rect width="288" height="206" rx="12" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" />
        
        <!-- Card Header -->
        <g transform="translate(18, 22)">
          <rect x="0" y="0" width="88" height="20" rx="5" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="0.8" />
          <text class="font-mono" x="44" y="14" text-anchor="middle" font-size="10" font-weight="600" fill="#38bdf8">SM-2 REVIEW</text>
          
          <text class="font-mono" x="252" y="14" text-anchor="end" font-size="11" fill="#64748b">Card 7 / 18</text>
        </g>

        <!-- Question Prompt -->
        <g transform="translate(18, 58)">
          <text class="font-sans" font-size="13" font-weight="600" fill="#f1f5f9" line-height="1.4">
            <tspan x="0" y="0">Why does Raft require a quorum</tspan>
            <tspan x="0" y="18">for log entry commitment?</tspan>
          </text>
          <text class="font-sans" x="0" y="46" font-size="11.5" fill="#94a3b8">
            Ensures intersection with next leader's
          </text>
          <text class="font-sans" x="0" y="62" font-size="11.5" fill="#94a3b8">
            voter set, preserving committed entries.
          </text>
        </g>

        <!-- Recall Buttons (Pure vector styling, zero emoji) -->
        <g transform="translate(18, 154)">
          <rect x="0" y="0" width="76" height="30" rx="6" fill="#1e293b" stroke="#e11d48" stroke-opacity="0.4" stroke-width="1" />
          <text class="font-sans" x="38" y="18.5" text-anchor="middle" font-size="11" font-weight="600" fill="#fb7185">Hard</text>

          <rect x="86" y="0" width="76" height="30" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
          <text class="font-sans" x="124" y="18.5" text-anchor="middle" font-size="11" font-weight="600" fill="#fbbf24">Good</text>

          <rect x="172" y="0" width="80" height="30" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.5" stroke-width="1" />
          <text class="font-sans" x="212" y="18.5" text-anchor="middle" font-size="11" font-weight="600" fill="#34d399">Easy (4d)</text>
        </g>
      </g>

      <!-- CARD 2B: Pomodoro Focus Session (Bottom Right Bento) -->
      <g transform="translate(302, 0)">
        <rect width="198" height="206" rx="12" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" />

        <g transform="translate(18, 22)">
          <text class="font-mono" font-size="10" font-weight="600" fill="#f59e0b" letter-spacing="0.06em">FOCUS SESSION</text>
        </g>

        <!-- Radial Countdown Display -->
        <g transform="translate(99, 94)">
          <circle cx="0" cy="0" r="38" fill="none" stroke="#1c2736" stroke-width="5" />
          <circle cx="0" cy="0" r="38" fill="none" stroke="url(#amberAccent)" stroke-width="5" stroke-dasharray="238.7" stroke-dashoffset="65" stroke-linecap="round" transform="rotate(-90)" />
          
          <text class="font-mono" x="0" y="7" text-anchor="middle" font-size="19" font-weight="800" fill="#f8fafc">25:00</text>
        </g>

        <!-- Status Badge (Vector Icon, zero emoji!) -->
        <g transform="translate(14, 154)">
          <rect width="170" height="30" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" stroke-width="0.8" />
          <!-- Vector Tree / Study Icon -->
          <polygon points="22,10 16,18 20,18 15,24 29,24 24,18 28,18" fill="#34d399" />
          <rect x="21" y="24" width="2" height="3" fill="#34d399" />
          <text class="font-sans" x="38" y="19" font-size="11" font-weight="600" fill="#6ee7b7">Island Nursery +1</text>
        </g>
      </g>

    </g>
  </g>
</svg>
