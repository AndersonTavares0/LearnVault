# LearnVault Rust workspace.
#
# The domain core lives in `crates/core` and is shared by the Axum server
# (`crates/server`) and by the Tauri desktop application (`crates/desktop`).
#
# The release version is owned by Release Please, at the repository level.
# The Rust crates are not published, so the version here is not a source of truth.

[workspace]
members = ["crates/core", "crates/server", "crates/desktop"]
# The desktop crate depends on the system webview (WebView2 on Windows, WebKitGTK on
# Linux) and on an already-built frontend shell. It is kept outside the default members so
# that `cargo build`, `cargo clippy` and `cargo test` on the core and the server stay
# free of graphical dependencies. Use `cargo ... -p learnvault-desktop` when that is what you need.
default-members = ["crates/core", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

# Argon2 is slow by security decision (m=64MiB, t=2) and dominates the time of the
# authentication tests. Optimizing only the Argon2id path in test/dev
# builds cuts the cost per hash from ~1.3s to ~60ms, without changing parameters
# or releases. `blake2` is Argon2id's compression function and accounts for the
# bulk of the remaining time; `debug = false` avoids generating debug
# information that the tests do not consume.
[profile.dev.package.argon2]
opt-level = 3
debug = false

[profile.dev.package.blake2]
opt-level = 3
debug = false
