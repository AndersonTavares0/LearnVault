# Workspace Rust do LearnVault.
#
# O núcleo de domínio vive em `crates/core` e é compartilhado pelo servidor Axum
# (`crates/server`) e pelo aplicativo desktop Tauri (`crates/desktop`).
#
# A versão de release é de propriedade do Release Please, no nível do repositório.
# Os crates Rust não são publicados, por isso a versão daqui não é fonte de verdade.

[workspace]
members = ["crates/core", "crates/server", "crates/desktop"]
# O crate desktop depende do webview do sistema (WebView2 no Windows, WebKitGTK no
# Linux) e de um shell frontend já construído. Ele fica fora dos membros padrão para
# que `cargo build`, `cargo clippy` e `cargo test` no núcleo e no servidor continuem
# sem dependências gráficas. Use `cargo ... -p learnvault-desktop` quando for o caso.
default-members = ["crates/core", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"

# O Argon2 é lento por decisão de segurança (m=64MiB, t=2) e domina o tempo dos
# testes de autenticação. Otimizar somente o caminho Argon2id nos builds de
# teste/dev reduz o custo por hash de ~1,3s para ~60ms, sem alterar parâmetros
# nem releases. O `blake2` é a função de compressão do Argon2id e responde pela
# maior parte do tempo restante; `debug = false` evita gerar informação de
# depuração que os testes não consomem.
[profile.dev.package.argon2]
opt-level = 3
debug = false

[profile.dev.package.blake2]
opt-level = 3
debug = false
