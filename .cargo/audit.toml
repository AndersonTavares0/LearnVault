# cargo-audit configuration for the LearnVault Rust workspace.
#
# This file does NOT disable Rust dependency auditing. It records, narrowly and
# traceably, the advisories accepted after review. Anything not listed under
# `ignore` still fails the check.
#
# Location: cargo-audit 0.22.x reads `.cargo/audit.toml` relative to the working
# directory; an `audit.toml` at the repository root is ignored by that version
# (verified 2026-10-18: a syntax error under `.cargo/` is reported, the same
# error at the root is not).
#
# The `Rust dependency audit` job (`.github/workflows/ci.yml`) runs
# `cargo audit --deny unsound`, which always fails on vulnerabilities and on
# advisories classified as `unsound`.

[advisories]
ignore = [
    # RUSTSEC-2024-0429 = GHSA-wrw7-89jp-8q8g (unsound)
    # glib >= 0.15.0, < 0.20.0 | first patched version: 0.20.0
    # "Unsoundness in `Iterator` and `DoubleEndedIterator` impls for
    # `glib::VariantStrIter`". Only
    # glib::VariantStrIter::{next,nth,last,next_back,nth_back} is affected.
    #
    # Why it is accepted today (2026-10-18):
    # - Cargo.lock resolves glib 0.18.5 through
    #   learnvault-desktop -> tauri 2.12.4 -> gtk 0.18.2 -> glib ^0.18.
    # - The fix only exists from glib 0.20.0, reachable only through
    #   gtk 0.19.0 -> glib 0.22, a breaking jump in the GTK/Tauri stack.
    # - There is no non-breaking upgrade path. The product owner decided not to
    #   take the upgrade now; Dependabot alert #16 stays open and tracked in its
    #   own issue.
    #
    # Removal condition: drop this entry as soon as the desktop stack
    # (Tauri/GTK) can consume glib >= 0.20.0, or immediately if the workspace
    # starts using glib::VariantStrIter directly.
    "RUSTSEC-2024-0429",

    # RUSTSEC-2023-0071 (medium, 5.9) — "Marvin Attack: potential key recovery
    # through timing sidechannels" in `rsa`.
    # rsa 0.10.0-rc.18 | first patched version: 0.10.0
    #
    # Why it is accepted today (2026-11-13):
    # - Cargo.lock resolves rsa 0.10.0-rc.18 through
    #   learnvault-server -> smb 0.12.1 -> sspi 0.21.3.
    # - `sspi` requires exactly `rsa = "=0.10.0-rc.18"`, and `smb` requires
    #   exactly `sspi = "=0.21.3"`. Even the newest `sspi` (0.23.1) pins the same
    #   release candidate, so there is no upgrade path on crates.io today.
    # - The advisory covers RSA private-key decryption timing. LearnVault only
    #   authenticates outbound SMB sessions with NTLM; Kerberos is disabled and
    #   no RSA private-key operation runs anywhere in the product.
    #
    # Removal condition: drop this entry as soon as `smb`/`sspi` accept rsa
    # >= 0.10.0 stable, or immediately if the product starts using Kerberos or
    # any RSA private-key operation.
    "RUSTSEC-2023-0071",
]
