# pnpm 11 denies dependency lifecycle scripts by default. esbuild is explicitly
# allowed because Vite uses its platform binary during the frontend build.
packages:
  - "apps/*"
allowBuilds:
  esbuild: true
# GHSA-gcqx-w48m-w2h4: low-severity deepmerge prototype poisoning, transitive via the shadcn CLI
# used for component scaffolding. Dev tooling only, not in the shipped SPA or desktop bundle, and no
# patched version is published. Remove when shadcn drops deepmerge or ships a patched release.
# GHSA-g3hv-75wg-m249: moderate minimatch ReDoS (>=7 <11.0.1), transitive via typescript-eslint and
# eslint. Build and lint tooling only; not in the shipped SPA or desktop bundle. Overriding to
# minimatch 11 breaks eslint-plugin-jsx-a11y. Remove when typescript-eslint ships a patched minimatch.
# GHSA-fc5q-39xc-vjpf: high-severity picomatch ReDoS (<= 4.0.7) on crafted extglobs such as +(*), transitive
# via vite (tinyglobby, fdir) and the other build and test tooling. `pnpm why -P picomatch` is empty and
# `pnpm audit --prod` is clean, so it is not in the shipped SPA, server or desktop bundle. Exploiting it needs
# an attacker to supply the glob pattern; the patterns here come from our own Vite and tool configuration.
# No patched version is published. Remove when picomatch ships a fix, and re-check at the next dependency review.
audit:
  ignore:
    - GHSA-gcqx-w48m-w2h4
    - GHSA-g3hv-75wg-m249
    - GHSA-fc5q-39xc-vjpf
