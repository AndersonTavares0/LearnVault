# pnpm 11 denies dependency lifecycle scripts by default. esbuild is explicitly
# allowed because Vite uses its platform binary during the frontend build.
packages:
  - "apps/*"
allowBuilds:
  esbuild: true
# GHSA-g3hv-75wg-m249: moderate minimatch ReDoS (>=7 <11.0.1), transitive via typescript-eslint and
# eslint. Build and lint tooling only; not in the shipped SPA or desktop bundle. Overriding to
# minimatch 11 breaks eslint-plugin-jsx-a11y. Remove when typescript-eslint ships a patched minimatch.
audit:
  ignore:
    - GHSA-g3hv-75wg-m249
