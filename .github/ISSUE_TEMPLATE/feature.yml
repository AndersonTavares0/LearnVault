name: Solicitação de feature
description: Proponha uma melhoria de comportamento ou produto
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema a resolver
      description: Qual necessidade ou limitação do usuário será resolvida?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Comportamento proposto
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      description: Como saberemos que a mudança está concluída?
    validations:
      required: true
  - type: markdown
    attributes:
      value: Features exigem uma issue antes da implementação. Use Discussions para dúvidas de design ainda não resolvidas.
