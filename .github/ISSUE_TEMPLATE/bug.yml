name: Bug report
description: Relate um problema reproduzível
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Remova credenciais, arquivos de cursos, endereços privados e dados pessoais antes de publicar.
  - type: input
    id: version
    attributes:
      label: Versão ou commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamento atual
    validations:
      required: true
