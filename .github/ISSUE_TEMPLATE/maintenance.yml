name: Dependencies or CI maintenance
description: Update dependencies or make a small CI adjustment
title: "chore: "
body:
  - type: markdown
    attributes:
      value: Remove credentials, course files, private addresses, and personal data before posting. Report suspected vulnerabilities privately through the [security policy](https://github.com/AndersonTavares0/LearnVault/security/policy), not in a public issue.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dependencies
        - GitHub Actions
        - CI/CD
        - Development tools
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: Explain the reason and expected impact.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: List the checks that must continue to pass.
    validations:
      required: true
  - type: markdown
    attributes:
      value: An issue is optional for small changes. Use a feature issue for behavior changes.
