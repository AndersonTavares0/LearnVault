name: Planning
description: Record context, scope, and acceptance criteria for planned work
title: "[Planning] "
labels:
  - planning
body:
  - type: markdown
    attributes:
      value: Remove credentials, course files, private addresses, and personal data before posting. Report suspected vulnerabilities privately through the [security policy](https://github.com/AndersonTavares0/LearnVault/security/policy), not in a public issue.
  - type: textarea
    id: objective
    attributes:
      label: Context and objective
      description: Explain why this work is needed and its expected result.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List what this plan includes.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Record what this work will not address.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: How will we know the work is complete?
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and dependencies
      description: List known risks, blockers, and dependencies.
    validations:
      required: true
  - type: markdown
    attributes:
      value: Use Discussions for unresolved questions before opening an issue.
