name: Release Please

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: release_please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/release-please-manifest.json
          skip-github-release: ${{ github.event_name != 'push' }}
          skip-github-pull-request: ${{ github.event_name == 'push' }}

      - name: Check out the release pull request
        if: steps.release_please.outputs.prs_created == 'true' && github.event_name != 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release_please.outputs.pr).headBranchName }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Apply the changelog house style
        if: steps.release_please.outputs.prs_created == 'true' && github.event_name != 'push'
        run: |
          node scripts/changelog-house-style.mjs
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "docs(release): apply changelog house style"
            git push
          fi
