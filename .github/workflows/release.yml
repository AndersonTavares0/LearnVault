name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to rebuild assets for, strict vX.Y.Z
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: Require a strict vX.Y.Z tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Unexpected release tag format: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Confirm the release exists and is published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! meta="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease 2>/dev/null)"; then
            echo "::error::No published release found for tag $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$(printf '%s' "$meta" | jq -r .isDraft)" == "true" ]]; then
            echo "::error::Release $RELEASE_TAG is still a draft; publish it before rebuilding assets" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve release tag commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release tag did not resolve to a commit" >&2
            exit 1
          fi
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

  linux:
    name: Build Linux assets
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-tag.outputs.commit_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustup target add x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build Linux Rust asset
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          test -f crates/server/web/build/200.html
          mkdir -p dist/web
          cp LICENSE dist/LICENSE
          cp -R crates/server/web/build/. dist/web/
          LEARNVAULT_BUILD_VERSION="$RELEASE_TAG" cargo build --release --locked --package learnvault-server --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/learnvault-server dist/learnvault-linux-amd64
          tar -czf "dist/learnvault-linux-amd64.tar.gz" -C dist "learnvault-linux-amd64" LICENSE web
          tar -tzf "dist/learnvault-linux-amd64.tar.gz" > /tmp/learnvault-linux-amd64.list
          grep -qx "web/200.html" /tmp/learnvault-linux-amd64.list
          rm "dist/learnvault-linux-amd64" dist/LICENSE
          rm -rf dist/web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-amd64
          path: dist/*.tar.gz
          if-no-files-found: error

  linux-arm64:
    name: Build Linux arm64 assets
    needs: validate-tag
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-tag.outputs.commit_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustup target add aarch64-unknown-linux-musl
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build arm64 Rust asset
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          set -euo pipefail
          test -f crates/server/web/build/200.html
          mkdir -p dist/web
          cp LICENSE dist/LICENSE
          cp -R crates/server/web/build/. dist/web/
          LEARNVAULT_BUILD_VERSION="$RELEASE_TAG" cargo build --release --locked --package learnvault-server --target aarch64-unknown-linux-musl
          cp target/aarch64-unknown-linux-musl/release/learnvault-server dist/learnvault-linux-arm64
          tar -czf "dist/learnvault-linux-arm64.tar.gz" -C dist "learnvault-linux-arm64" LICENSE web
          tar -tzf "dist/learnvault-linux-arm64.tar.gz" > /tmp/learnvault-linux-arm64.list
          grep -qx "web/200.html" /tmp/learnvault-linux-arm64.list
          rm "dist/learnvault-linux-arm64" dist/LICENSE
          rm -rf dist/web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-arm64
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Build Windows NSIS installer
    needs: validate-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-tag.outputs.commit_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:desktop
      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Select Rust toolchain
        shell: pwsh
        run: rustup default 1.99.0
      - name: Build NSIS installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "A chave secreta TAURI_SIGNING_PRIVATE_KEY é obrigatória para assinar os artefatos de release do Windows"
          }
          $releaseVersion = $env:RELEASE_TAG.Substring(1)
          $configPath = Join-Path $PWD "tauri.release.json"
          @{ version = $releaseVersion } | ConvertTo-Json -Compress | Set-Content -Path $configPath -NoNewline
          pnpm exec tauri build --bundles nsis --config crates/desktop/tauri.conf.json --config $configPath
      - name: Stage Windows asset
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $installers = @(Get-ChildItem target/release/bundle/nsis -Filter *.exe -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }
          Copy-Item $installers[0].FullName (Join-Path $PWD "dist/learnvault-windows-$env:RELEASE_TAG.exe")
          $zips = @(Get-ChildItem target/release/bundle/nsis -Filter *.nsis.zip -File)
          if ($zips.Count -ne 1) {
            throw "Expected exactly one NSIS updater bundle, found $($zips.Count)"
          }
          Copy-Item $zips[0].FullName (Join-Path $PWD "dist/learnvault-windows-$env:RELEASE_TAG.nsis.zip")
          $sigs = @(Get-ChildItem target/release/bundle/nsis -Filter *.nsis.zip.sig -File)
          if ($sigs.Count -ne 1) {
            throw "Expected exactly one NSIS updater signature, found $($sigs.Count)"
          }
          Copy-Item $sigs[0].FullName (Join-Path $PWD "dist/learnvault-windows-$env:RELEASE_TAG.nsis.zip.sig")
          $sigContent = (Get-Content $sigs[0].FullName -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($sigContent)) {
            throw "A assinatura do updater gerada em $($sigs[0].FullName) está vazia"
          }
          $assetUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/learnvault-windows-$env:RELEASE_TAG.nsis.zip"
          $latest = @{
            version = $env:RELEASE_TAG
            notes = "LearnVault release $env:RELEASE_TAG"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigContent
                url = $assetUrl
              }
              "windows-x86_64-nsis" = @{
                signature = $sigContent
                url = $assetUrl
              }
            }
          }
          $latest | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $PWD "dist/latest.json") -Encoding UTF8
          if (-not (Test-Path (Join-Path $PWD "dist/latest.json"))) {
            throw "Falha ao gerar o manifesto dist/latest.json obrigatório"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  container:
    name: Build and publish container image (GHCR)
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.validate-tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4460bfa22da0201984444f8750d4 # v3.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d688f8d6b76e9f6580a9f2118 # v5.6.1
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate-tag.outputs.tag }}
            type=raw,value=latest
      - name: Build and push OCI image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: deploy/container/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    name: Publish release assets
    needs: [validate-tag, linux, linux-arm64, windows, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.validate-tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm release tag did not move
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.validate-tag.outputs.commit_sha }}
        run: |
          set -euo pipefail
          actual_commit_sha="$(git rev-parse HEAD)"
          if [[ "$actual_commit_sha" != "$EXPECTED_COMMIT_SHA" ]]; then
            echo "::error::Release tag moved during the build (expected $EXPECTED_COMMIT_SHA, found $actual_commit_sha)" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create SHA256SUMS
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          expected=(
            "learnvault-linux-amd64.tar.gz"
            "learnvault-linux-arm64.tar.gz"
            "learnvault-windows-${RELEASE_TAG}.exe"
            "learnvault-windows-${RELEASE_TAG}.nsis.zip"
            "learnvault-windows-${RELEASE_TAG}.nsis.zip.sig"
            "latest.json"
          )
          mapfile -t actual < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          if (( ${#actual[@]} != ${#expected[@]} )); then
            printf '::error::Unexpected release asset count (expected %d, found %d)\n' "${#expected[@]}" "${#actual[@]}" >&2
            exit 1
          fi
          for asset in "${expected[@]}"; do
            if [[ ! -f "dist/$asset" ]]; then
              echo "::error::Missing expected release asset: $asset" >&2
              exit 1
            fi
          done
          printf '%s\n' "${actual[@]}" | sort | diff -u <(printf '%s\n' "${expected[@]}" | sort) -
          (cd dist && sha256sum "${expected[@]}" > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Upload assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          expected=(
            "learnvault-linux-amd64.tar.gz"
            "learnvault-linux-arm64.tar.gz"
            "learnvault-windows-${RELEASE_TAG}.exe"
            "learnvault-windows-${RELEASE_TAG}.nsis.zip"
            "learnvault-windows-${RELEASE_TAG}.nsis.zip.sig"
            "latest.json"
          )
          upload_args=()
          for asset in "${expected[@]}"; do
            upload_args+=("dist/$asset")
          done
          upload_args+=("dist/SHA256SUMS")
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            "${upload_args[@]}" \
            --clobber
      - name: Attribute release contributors
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          trap 'rm -f "$notes"' EXIT
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$notes"
          if grep -Fqx '<!-- learnvault:contributors -->' "$notes"; then
            exit 0
          fi
          previous_tag="$(git tag --merged HEAD --sort=-version:refname | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | grep -Fxv "$RELEASE_TAG" | head -n 1 || true)"
          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..HEAD"
          else
            range="HEAD"
          fi
          contributors_text="$(
            {
              git log --format='%aN%x09%aE' "$range"
              git log --format='%b' "$range" | sed -n 's/^Co-authored-by: \(.*\) <\([^<>]*\)>$/\1\t\2/p'
            } | tr -d '\r' | node scripts/release-contributors.mjs
          )"
          mapfile -t contributors <<< "$contributors_text"
          if [[ -z "$contributors_text" ]]; then
            echo "::error::Release has no attributable commit authors" >&2
            exit 1
          fi
          {
            printf '\n\n---\n\n<!-- learnvault:contributors -->\n## Contribuidores\n\n'
            for contributor in "${contributors[@]}"; do
              escaped="$(printf '%s' "$contributor" | sed -e 's/\\/\\\\/g' -e 's/`/\\`/g' -e 's/\*/\\*/g' -e 's/_/\\_/g' -e 's/{/\\{/g' -e 's/}/\\}/g' -e 's/\[/\\[/g' -e 's/\]/\\]/g' -e 's/</\\</g' -e 's/>/\\>/g' -e 's/|/\\|/g')"
              printf -- '- %s\n' "$escaped"
            done
          } >> "$notes"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
