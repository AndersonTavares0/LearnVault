name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to rebuild assets for, strict vX.Y.Z
        required: true
        type: string

permissions:
  contents: read

# A published release and a manual repair of the same tag must not interleave: both build a
# digest and then move the same tags and `gh release upload --clobber` the same asset names.
# Queue instead of cancelling, so the last run wins as a whole. Waiting for the `release`
# environment approval is outside the job timeout, so a long review does not cancel anything.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      release_notes_base64: ${{ steps.release-notes.outputs.release_notes_base64 }}
      prerelease: ${{ steps.release-kind.outputs.prerelease }}
    steps:
      - name: Require the trusted release workflow ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "::error::Manual release repair must run from main" >&2
            exit 1
          fi
      - name: Require a strict vX.Y.Z tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Unexpected release tag format: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      # A draft is never built. A pre-release is built and published under its exact version only:
      # it never moves :stable, :latest or the minor tag, and the updater (releases/latest) never sees it.
      - name: Require an existing published release
        id: release-kind
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          meta="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)"
          if [[ "$(jq -r .isDraft <<<"$meta")" != "false" ]]; then
            echo "::error::$RELEASE_TAG must be a published release (not a draft)" >&2
            exit 1
          fi
          prerelease="$(jq -r .isPrerelease <<<"$meta")"
          if [[ "$prerelease" != "true" && "$prerelease" != "false" ]]; then
            echo "::error::Could not tell whether $RELEASE_TAG is a pre-release" >&2
            exit 1
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Resolve release notes
        id: release-notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          release_notes="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""')"
          if [[ -z "$release_notes" ]]; then
            release_notes="LearnVault release $RELEASE_TAG"
          fi
          release_notes_base64="$(printf '%s' "$release_notes" | base64 -w 0)"
          echo "release_notes_base64=$release_notes_base64" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve release tag commit
        id: commit
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release tag did not resolve to a commit" >&2
            exit 1
          fi
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

  linux:
    name: Build Linux assets
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-tag.outputs.commit_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # A release must not restore a cache that an earlier run could have written (setup-node turns one on by itself).
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustup target add x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build Linux Rust asset
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          test -f crates/server/web/build/200.html
          mkdir -p dist/web
          cp LICENSE dist/LICENSE
          cp -R crates/server/web/build/. dist/web/
          LEARNVAULT_BUILD_VERSION="$RELEASE_TAG" cargo build --release --locked --package learnvault-server --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/learnvault-server dist/learnvault-linux-amd64
          tar -czf "dist/learnvault-linux-amd64.tar.gz" -C dist "learnvault-linux-amd64" LICENSE web
          tar -tzf "dist/learnvault-linux-amd64.tar.gz" > /tmp/learnvault-linux-amd64.list
          grep -qx "web/200.html" /tmp/learnvault-linux-amd64.list
          rm "dist/learnvault-linux-amd64" dist/LICENSE
          rm -rf dist/web
      - name: Smoke test packaged Linux amd64 binary
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf "dist/learnvault-linux-amd64.tar.gz" -C "$smoke_dir"
          ./scripts/smoke-release-binary.sh "$smoke_dir/learnvault-linux-amd64" "$RELEASE_TAG" "$smoke_dir/web"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-amd64
          path: dist/*.tar.gz
          if-no-files-found: error

  linux-arm64:
    name: Build Linux arm64 assets
    needs: validate-tag
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-tag.outputs.commit_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # A release must not restore a cache that an earlier run could have written (setup-node turns one on by itself).
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustup target add aarch64-unknown-linux-musl
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build arm64 Rust asset
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          set -euo pipefail
          test -f crates/server/web/build/200.html
          mkdir -p dist/web
          cp LICENSE dist/LICENSE
          cp -R crates/server/web/build/. dist/web/
          LEARNVAULT_BUILD_VERSION="$RELEASE_TAG" cargo build --release --locked --package learnvault-server --target aarch64-unknown-linux-musl
          cp target/aarch64-unknown-linux-musl/release/learnvault-server dist/learnvault-linux-arm64
          tar -czf "dist/learnvault-linux-arm64.tar.gz" -C dist "learnvault-linux-arm64" LICENSE web
          tar -tzf "dist/learnvault-linux-arm64.tar.gz" > /tmp/learnvault-linux-arm64.list
          grep -qx "web/200.html" /tmp/learnvault-linux-arm64.list
          rm "dist/learnvault-linux-arm64" dist/LICENSE
          rm -rf dist/web
      - name: Smoke test packaged Linux arm64 binary
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf "dist/learnvault-linux-arm64.tar.gz" -C "$smoke_dir"
          ./scripts/smoke-release-binary.sh "$smoke_dir/learnvault-linux-arm64" "$RELEASE_TAG" "$smoke_dir/web"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-arm64
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Build Windows NSIS installer
    needs: validate-tag
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-tag.outputs.commit_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # A release must not restore a cache that an earlier run could have written (setup-node turns one on by itself).
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:desktop
      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Select Rust toolchain
        shell: pwsh
        run: rustup default 1.99.0
      - name: Build NSIS installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "The secret TAURI_SIGNING_PRIVATE_KEY is required to sign the Windows release artifacts"
          }
          $releaseVersion = $env:RELEASE_TAG.Substring(1)
          $configPath = Join-Path $PWD "tauri.release.json"
          @{
            version = $releaseVersion
            bundle = @{
              createUpdaterArtifacts = "v1Compatible"
            }
          } | ConvertTo-Json -Depth 4 -Compress | Set-Content -Path $configPath -NoNewline
          pnpm exec tauri build --bundles nsis --config crates/desktop/tauri.conf.json --config $configPath
      - name: Stage Windows asset
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_NOTES_BASE64: ${{ needs.validate-tag.outputs.release_notes_base64 }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $installers = @(Get-ChildItem target/release/bundle/nsis -Filter *.exe -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }
          Copy-Item $installers[0].FullName (Join-Path $PWD "dist/learnvault-windows-$env:RELEASE_TAG.exe")
          $zips = @(Get-ChildItem target/release/bundle/nsis -Filter *.nsis.zip -File)
          if ($zips.Count -ne 1) {
            throw "Expected exactly one NSIS updater bundle, found $($zips.Count)"
          }
          Copy-Item $zips[0].FullName (Join-Path $PWD "dist/learnvault-windows-$env:RELEASE_TAG.nsis.zip")
          $sigs = @(Get-ChildItem target/release/bundle/nsis -Filter *.nsis.zip.sig -File)
          if ($sigs.Count -ne 1) {
            throw "Expected exactly one NSIS updater signature, found $($sigs.Count)"
          }
          Copy-Item $sigs[0].FullName (Join-Path $PWD "dist/learnvault-windows-$env:RELEASE_TAG.nsis.zip.sig")
          $sigContent = (Get-Content $sigs[0].FullName -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($sigContent)) {
            throw "The updater signature generated at $($sigs[0].FullName) is empty"
          }
          $assetUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/learnvault-windows-$env:RELEASE_TAG.nsis.zip"
          $releaseNotes = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:RELEASE_NOTES_BASE64))
          $latest = @{
            version = $env:RELEASE_TAG
            notes = $releaseNotes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigContent
                url = $assetUrl
              }
              "windows-x86_64-nsis" = @{
                signature = $sigContent
                url = $assetUrl
              }
            }
          }
          $latest | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $PWD "dist/latest.json") -Encoding UTF8
          if (-not (Test-Path (Join-Path $PWD "dist/latest.json"))) {
            throw "Failed to generate the required manifest dist/latest.json"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  flatpak:
    needs: validate-tag
    uses: ./.github/workflows/flatpak.yml
    with:
      ref: ${{ needs.validate-tag.outputs.commit_sha }}

  container-approval:
    name: Approve the container image publication
    # Every platform build must pass before anything is pushed, tagged or offered for approval.
    needs: [validate-tag, linux, linux-arm64, windows]
    runs-on: ubuntu-latest
    # Waits for a reviewer approval in the `release` environment before any image is pushed.
    environment: release
    steps:
      - name: Record the approval
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: echo "Container publication approved for ${RELEASE_TAG}"

  container-build:
    name: Build and scan the ${{ matrix.arch }} image
    needs: [validate-tag, container-approval]
    # Each architecture builds on its own runner: no QEMU emulation. Images are pushed by digest, so no name points at them yet.
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate-tag.outputs.tag }},enable=${{ needs.validate-tag.outputs.prerelease == 'false' }}
            type=raw,value=stable,enable=${{ github.event_name == 'release' && needs.validate-tag.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && needs.validate-tag.outputs.prerelease == 'false' }}
      - name: Resolve the lowercase image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Confirm container release tag did not move
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.validate-tag.outputs.commit_sha }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          actual_commit_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$actual_commit_sha" != "$EXPECTED_COMMIT_SHA" ]]; then
            echo "::error::Release tag moved during the build (expected $EXPECTED_COMMIT_SHA, found $actual_commit_sha)" >&2
            exit 1
          fi
      # Push by digest only: no name points at the image yet, so nothing can pull it until it passes the scan.
      # The per-architecture digest carries its own provenance attestation.
      - name: Build and push the image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/container/Containerfile
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
          build-args: |
            LEARNVAULT_BUILD_VERSION=${{ needs.validate-tag.outputs.tag }}
          provenance: mode=max
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
      - name: Scan the pushed image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          version: v0.70.0
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Smoke test the pushed ${{ matrix.arch }} image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          CONTAINER: learnvault-release-smoke-${{ matrix.arch }}-${{ github.run_id }}
          SKIP_BUILD: '1'
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          ./scripts/verify-rust-oci.sh
      - name: Keep the scanned digest for the index
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${ARCH}.txt"
      - name: Upload the scanned digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1

  container:
    name: Publish the container image (GHCR)
    needs: [validate-tag, container-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: the job proves who it is to Sigstore with a short-lived OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the lowercase image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Download the scanned digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: container-digest-*
          path: digests
          merge-multiple: true
      - name: Confirm container release tag did not move
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.validate-tag.outputs.commit_sha }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          actual_commit_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$actual_commit_sha" != "$EXPECTED_COMMIT_SHA" ]]; then
            echo "::error::Release tag moved during the build (expected $EXPECTED_COMMIT_SHA, found $actual_commit_sha)" >&2
            exit 1
          fi
      # The index needs a name to be pushed. It is a staging name (not a release tag) that is created only from digests that already passed the scan.
      - name: Create the multi-architecture index from the scanned digests
        id: index
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          amd64="$(tr -d '[:space:]' < digests/amd64.txt)"
          arm64="$(tr -d '[:space:]' < digests/arm64.txt)"
          test -n "$amd64" && test -n "$arm64"
          docker buildx imagetools create \
            --tag "${IMAGE}:staging-${RUN_ID}" "${IMAGE}@${amd64}" "${IMAGE}@${arm64}"
          # Read the digest back from the registry: the metadata file written by imagetools is not reliable here.
          digest="$(docker buildx imagetools inspect "${IMAGE}:staging-${RUN_ID}" --format '{{.Manifest.Digest}}')"
          [[ "$digest" == sha256:* ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Check that both architectures and their attestations are in the index
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          raw="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")"
          printf '%s' "$raw" | jq -e '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length >= 1' >/dev/null
          printf '%s' "$raw" | jq -e '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length >= 1' >/dev/null
          attestations="$(printf '%s' "$raw" | jq '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length')"
          if (( attestations < 2 )); then
            echo "::error::Expected provenance attestations for both architectures, found $attestations" >&2
            exit 1
          fi
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          # Registries want a lowercase repository name (the metadata action lowercases the tags too).
          IMAGE="ghcr.io/${REPOSITORY,,}"
          # The signature covers the digest, so every tag that points at it is signed.
          cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Check the signature before publishing the release
        shell: bash
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${REPOSITORY,,}"
          # The certificate identity keeps the repository's original case; only the image name is lowercased.
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github\\.com/${REPOSITORY//./\\.}/\\.github/workflows/release\\.yml@refs/(tags/v[0-9]+\\.[0-9]+\\.[0-9]+|heads/main)$" >/dev/null
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate-tag.outputs.tag }},enable=${{ needs.validate-tag.outputs.prerelease == 'false' }}
            type=raw,value=stable,enable=${{ github.event_name == 'release' && needs.validate-tag.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && needs.validate-tag.outputs.prerelease == 'false' }}
      # Tags are applied last: only a scanned and signed-and-verified digest gets :version, :stable or :latest.
      - name: Apply the release tags to the verified image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.index.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          mapfile -t tags <<< "$TAGS"
          args=()
          for tag in "${tags[@]}"; do
            if [[ -n "$tag" ]]; then args+=(--tag "$tag"); fi
          done
          test "${#args[@]}" -gt 0
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
      # Only delete a package version whose sole tag is staging-<run_id> (orphaned by a failed run).
      # On a successful run the release tags share the same digest/version, so deleting it would delete the release.
      - name: Clean up temporary staging tag
        if: ${{ !cancelled() && steps.index.outputs.digest != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          owner="${REPOSITORY%%/*}"
          pkg="${REPOSITORY#*/}"
          pkg="${pkg,,}"
          staging_tag="staging-${RUN_ID}"
          version_id="$(
            gh api --paginate "/users/${owner}/packages/container/${pkg}/versions" \
              --jq ".[] | select((.metadata.container.tags // []) == [\"${staging_tag}\"]) | .id" \
              | head -n 1 || true
          )"
          if [[ -n "$version_id" ]]; then
            gh api -X DELETE "/users/${owner}/packages/container/${pkg}/versions/${version_id}" || \
              echo "::warning::Failed to delete orphaned GHCR staging tag ${staging_tag} (version ${version_id})" >&2
          fi

  publish:
    name: Publish release assets
    needs: [validate-tag, linux, linux-arm64, windows, flatpak, container]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate CycloneDX SBOM for release binaries
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: dist/learnvault-${{ needs.validate-tag.outputs.tag }}.sbom.cdx.json
          version: v0.70.0
      - name: Create SHA256SUMS
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          expected=(
            "learnvault-linux-amd64.tar.gz"
            "learnvault-linux-arm64.tar.gz"
            "learnvault-windows-${RELEASE_TAG}.exe"
            "learnvault-windows-${RELEASE_TAG}.nsis.zip"
            "learnvault-windows-${RELEASE_TAG}.nsis.zip.sig"
            "learnvault-linux-desktop-amd64.flatpak"
            "learnvault-linux-desktop-arm64.flatpak"
            "learnvault-${RELEASE_TAG}.sbom.cdx.json"
            "latest.json"
          )
          mapfile -t actual < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          if (( ${#actual[@]} != ${#expected[@]} )); then
            printf '::error::Unexpected release asset count (expected %d, found %d)\n' "${#expected[@]}" "${#actual[@]}" >&2
            exit 1
          fi
          for asset in "${expected[@]}"; do
            if [[ ! -f "dist/$asset" ]]; then
              echo "::error::Missing expected release asset: $asset" >&2
              exit 1
            fi
          done
          printf '%s\n' "${actual[@]}" | sort | diff -u <(printf '%s\n' "${expected[@]}" | sort) -
          (cd dist && sha256sum "${expected[@]}" > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign SHA256SUMS (keyless)
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          cosign verify-blob dist/SHA256SUMS \
            --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github\\.com/${REPOSITORY//./\\.}/\\.github/workflows/release\\.yml@refs/(tags/v[0-9]+\\.[0-9]+\\.[0-9]+|heads/main)$" >/dev/null
      - name: Attest build provenance for release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Attest SBOM for release assets
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: 'dist/learnvault-*.tar.gz,dist/learnvault-*.exe,dist/learnvault-*.nsis.zip,dist/learnvault-*.flatpak'
          sbom-path: 'dist/learnvault-${{ needs.validate-tag.outputs.tag }}.sbom.cdx.json'
      - name: Confirm release tag did not move
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.validate-tag.outputs.commit_sha }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          actual_commit_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$actual_commit_sha" != "$EXPECTED_COMMIT_SHA" ]]; then
            echo "::error::Release tag moved during the build (expected $EXPECTED_COMMIT_SHA, found $actual_commit_sha)" >&2
            exit 1
          fi
      - name: Upload assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          expected=(
            "learnvault-linux-amd64.tar.gz"
            "learnvault-linux-arm64.tar.gz"
            "learnvault-windows-${RELEASE_TAG}.exe"
            "learnvault-windows-${RELEASE_TAG}.nsis.zip"
            "learnvault-windows-${RELEASE_TAG}.nsis.zip.sig"
            "learnvault-linux-desktop-amd64.flatpak"
            "learnvault-linux-desktop-arm64.flatpak"
            "learnvault-${RELEASE_TAG}.sbom.cdx.json"
            "latest.json"
          )
          upload_args=()
          for asset in "${expected[@]}"; do
            upload_args+=("dist/$asset")
          done
          upload_args+=("dist/SHA256SUMS" "dist/SHA256SUMS.sigstore.json")
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            "${upload_args[@]}" \
            --clobber
      - name: Attribute release contributors
        if: ${{ github.event_name == 'release' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          trap 'rm -f "$notes"' EXIT
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$notes"
          if ! grep -Fqx '<!-- learnvault:contributors -->' "$notes"; then
            previous_tag="$(git tag --merged HEAD --sort=-version:refname | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | grep -Fxv "$RELEASE_TAG" | head -n 1 || true)"
            if [[ -n "$previous_tag" ]]; then
              range="$previous_tag..HEAD"
            else
              range="HEAD"
            fi
            contributors_text="$(
              {
                git log --format='%aN%x09%aE' "$range"
                git log --format='%b' "$range" | sed -n 's/^Co-authored-by: \(.*\) <\([^<>]*\)>$/\1\t\2/p'
              } | tr -d '\r' | node scripts/release-contributors.mjs
            )"
            mapfile -t contributors <<< "$contributors_text"
            if [[ -n "$contributors_text" ]]; then
              {
                printf '\n\n---\n\n<!-- learnvault:contributors -->\n## Contributors\n\n'
                for contributor in "${contributors[@]}"; do
                  escaped="$(printf '%s' "$contributor" | sed -e 's/\\/\\\\/g' -e 's/`/\\`/g' -e 's/\*/\\*/g' -e 's/_/\\_/g' -e 's/{/\\{/g' -e 's/}/\\}/g' -e 's/\[/\\[/g' -e 's/\]/\\]/g' -e 's/</\\</g' -e 's/>/\\>/g' -e 's/|/\\|/g')"
                  printf -- '- %s\n' "$escaped"
                done
              } >> "$notes"
            fi
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          fi

  verify-published:
    name: Verify published release
    needs: [validate-tag, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p verify-dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir verify-dist
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify published checksums, signature, and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cosign verify-blob verify-dist/SHA256SUMS \
            --bundle verify-dist/SHA256SUMS.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github\\.com/${REPOSITORY//./\\.}/\\.github/workflows/release\\.yml@refs/(tags/v[0-9]+\\.[0-9]+\\.[0-9]+|heads/main)$" >/dev/null
          (cd verify-dist && sha256sum -c SHA256SUMS)
          gh attestation verify verify-dist/learnvault-linux-amd64.tar.gz --repo "$REPOSITORY"
      - name: Verify published container image signature
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${REPOSITORY,,}"
          VERSION="${RELEASE_TAG#v}"
          IDENTITY="^https://github\\.com/${REPOSITORY//./\\.}/\\.github/workflows/release\\.yml@refs/(tags/v[0-9]+\\.[0-9]+\\.[0-9]+|heads/main)$"
          cosign verify "${IMAGE}:${VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$IDENTITY" >/dev/null
          if [[ "$PRERELEASE" == "false" && "$EVENT_NAME" == "release" ]]; then
            for tag in stable latest; do
              cosign verify "${IMAGE}:${tag}" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                --certificate-identity-regexp "$IDENTITY" >/dev/null
            done
          fi
      - name: Smoke test downloaded Linux amd64 binary
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf verify-dist/learnvault-linux-amd64.tar.gz -C "$smoke_dir"
          ./scripts/smoke-release-binary.sh "$smoke_dir/learnvault-linux-amd64" "$RELEASE_TAG" "$smoke_dir/web"
      - name: Notify loudly on post-publication verification failure
        if: failure()
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          echo "::error::Post-publication verification failed for ${RELEASE_TAG}. Trigger the Rollback workflow (.github/workflows/rollback.yml) to repoint GHCR :stable/:latest and minor tags to the previous verified release." >&2
          {
            echo "## Post-publication verification FAILED for ${RELEASE_TAG}"
            echo ""
            echo "Action required: trigger the **Rollback** workflow (\`.github/workflows/rollback.yml\`) to repoint GHCR \`:stable\`, \`:latest\`, and minor tags to the previous verified digest, and follow the updater recovery steps in \`docs/releases/process.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
