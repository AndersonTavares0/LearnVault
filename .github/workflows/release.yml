name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.14'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: go test ./...
      - name: Build Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tag="${{ github.event.release.tag_name }}"
          for arch in amd64 arm64; do
             GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$tag" -o "dist/learnvault-linux-$arch" ./cmd/learnvault
             tar -czf "dist/learnvault-linux-$arch.tar.gz" -C dist "learnvault-linux-$arch"
          done
          sha256sum dist/*.tar.gz > dist/SHA256SUMS
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.tar.gz dist/SHA256SUMS --clobber
