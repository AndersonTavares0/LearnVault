name: Labeler

# Somente metadados do evento: sem checkout, sem segredos e sem execução de código da PR.
# A configuração .github/labeler.yml é lida da base confiável, nunca do head da PR.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  labeler:
    name: Classificar PR por arquivos alterados
    # Job informacional: não é check obrigatório e não bloqueia merge.
    # Forks não fazem parte do fluxo do repositório; execuções de fork são ignoradas.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Aplicar labels por arquivos alterados
        # SHA completo verificado; o comentário mantém a atualização do Dependabot previsível.
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
          dot: true
