name: Labeler

# Event metadata only: no checkout, no secrets and no execution of PR code.
# The .github/labeler.yml configuration is read from the trusted base, never from the PR head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  labeler:
    name: Label pull request by changed files
    # Informational job: not a required check and does not block merge.
    # Forks are not part of the repository's flow; fork runs are ignored.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply labels by changed files
        # Full SHA verified; the comment keeps Dependabot updates predictable.
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
          dot: true
