name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go tests and vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@v4
        with:
          name: spa-build
          path: cmd/learnvault/web/build
      - shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...

  web:
    name: SPA checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm audit --audit-level=low
      - uses: actions/upload-artifact@v4
        with:
          name: spa-build
          path: cmd/learnvault/web/build
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/container/Containerfile
          push: false
          tags: learnvault:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
