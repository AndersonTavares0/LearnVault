name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: SPA checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run build:desktop
      - run: pnpm --filter learnvault-web test
      - name: Plugin guard tests
        run: node --test .opencode/plugins/main-branch-guard.test.mjs
      - name: Dependabot auto-merge gate tests
        run: node --test scripts/dependabot-automerge.test.mjs
      - run: pnpm audit --audit-level=low
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spa-build
          path: crates/server/web/build
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spa-desktop-build
          path: crates/desktop/frontend-dist
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  e2e-server:
    name: Rust server browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spa-build
          path: crates/server/web/build
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo build -p learnvault-server
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/server.spec.ts
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-server-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  rust-container:
    name: Container build (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and validate the Rust container image
        shell: bash
        run: ./scripts/verify-rust-oci.sh
      - name: Scan the Rust image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: learnvault-rust-validation:local
          version: v0.70.0
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

  rust:
    name: Rust tests and lints
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spa-build
          path: crates/server/web/build
      - name: Verify the canonical SPA shell
        run: test -f crates/server/web/build/200.html
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Cache Cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.99.0-workspace-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-1.99.0-workspace-
      - name: Cache cargo-llvm-cov
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-llvm-cov-${{ runner.os }}-1.99.0
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --exclude learnvault-desktop --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace --exclude learnvault-desktop
      - name: Run tests with coverage
        run: cargo llvm-cov --package learnvault-core --all-targets --fail-under-lines 80

  desktop:
    name: Desktop crate compile and guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spa-desktop-build
          path: crates/desktop/frontend-dist
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Cache Cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.99.0-desktop-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-1.99.0-desktop-
      - name: Run clippy on the desktop crate
        run: cargo clippy -p learnvault-desktop --all-targets -- -D warnings
      - name: Run desktop tests
        run: cargo test -p learnvault-desktop
