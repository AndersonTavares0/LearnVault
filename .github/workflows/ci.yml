name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go tests and vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: services/go/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: spa-build
          path: services/go/cmd/learnvault/web/build
      - shell: bash
        run: test -z "$(gofmt -l services/go)"
      - run: go -C services/go test -race ./...
      - run: go -C services/go vet ./...

  web:
    name: SPA checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run build:desktop
      - run: pnpm --filter learnvault-web test
      - name: Plugin guard tests
        run: node --test .opencode/plugins/main-branch-guard.test.mjs
      - run: pnpm audit --audit-level=low
      - uses: actions/upload-artifact@v7
        with:
          name: spa-build
          path: services/go/cmd/learnvault/web/build
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
      - uses: actions/upload-artifact@v7
        with:
          name: spa-desktop-build
          path: crates/desktop/frontend-dist
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [go, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/container/Containerfile
          push: false
          tags: learnvault:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rust:
    name: Rust tests and lints
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: spa-build
          path: services/go/cmd/learnvault/web/build
      - name: Verify the canonical SPA shell
        run: test -f services/go/cmd/learnvault/web/build/200.html
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Cache Cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.99.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-1.99.0-
      - name: Cache cargo-llvm-cov
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-llvm-cov-${{ runner.os }}-1.99.0
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --exclude learnvault-desktop --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace --exclude learnvault-desktop
      - name: Run tests with coverage
        run: cargo llvm-cov --package learnvault-core --all-targets --fail-under-lines 80

  desktop:
    name: Desktop crate compile and guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: spa-desktop-build
          path: crates/desktop/frontend-dist
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Cache Cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.99.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-1.99.0-
      - name: Run clippy on the desktop crate
        run: cargo clippy -p learnvault-desktop --all-targets -- -D warnings
      - name: Run desktop tests
        run: cargo test -p learnvault-desktop
