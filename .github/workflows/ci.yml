name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go tests and vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@v8
        with:
          name: spa-build
          path: cmd/learnvault/web/build
      - shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...

  web:
    name: SPA checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm audit --audit-level=low
      - uses: actions/upload-artifact@v7
        with:
          name: spa-build
          path: cmd/learnvault/web/build
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [go, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/container/Containerfile
          push: false
          tags: learnvault:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rust:
    name: Rust tests and lints
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Cache Cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.99.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-1.99.0-
      - name: Cache cargo-llvm-cov
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-llvm-cov-${{ runner.os }}-1.99.0
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests with coverage
        run: cargo llvm-cov --package learnvault-core --all-targets --fail-under-lines 80
