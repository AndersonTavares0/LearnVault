# Cleans up the GitHub Actions caches of a pull request when it is closed,
# freeing the repository's cache storage quota.
# Tracked by Issue #71 (CI efficiency and cost).
# No source checkout and no secrets: it uses only the GITHUB_TOKEN with the
# minimum privilege required (`actions: write`).
name: Cleanup PR caches

on:
  pull_request:
    types: [closed]

permissions:
  actions: write

concurrency:
  group: cleanup-pr-caches-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete caches for the closed pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete caches scoped to the pull request merge ref
        env:
          # Automatic workflow token; no secret is needed.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # The PR number arrives through an environment variable (never interpolated into the
          # script) and is validated as digits before composing the ref.
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected pull request number: '${PR_NUMBER}'"
            exit 1
          fi

          ref="refs/pull/${PR_NUMBER}/merge"
          echo "Caches currently stored under ${ref}:"
          gh cache list --ref "${ref}" --limit 100

          # `--succeed-on-no-caches` avoids a failure when the PR produced no cache.
          gh cache delete --all --ref "${ref}" --succeed-on-no-caches
