name: Rollback

# Manual rollback to a known-good release. It restores the GHCR moving aliases (:latest, :stable and the
# minor tags) to the state recorded before the bad release, including aliases that did not exist (those are
# removed), and moves the GitHub "latest" flag back. It never deletes, moves or recreates a git tag or a
# published vX.Y.Z image tag. See docs/operations/rollback.md.

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: Known-good release tag to roll back to, strict vX.Y.Z
        required: true
        type: string
      bad_version:
        description: Bad release tag to demote to a pre-release, strict vX.Y.Z
        required: true
        type: string
      recorded_aliases:
        description: 'Pre-release alias record as JSON, e.g. {"latest":"sha256:...","stable":null,"0.8":"sha256:...","0.9":null}'
        required: true
        type: string
      staging_run:
        description: Optional Release run id whose staging-<run> image should be cleaned up (only if it is the sole tag)
        required: false
        default: ''
        type: string
      dry_run:
        description: Print the plan without changing anything
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# Shared with the Release workflow: both move the same aliases, so they must never run at the same time.
# Queue, never cancel: a running release must not be interrupted.
concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  plan:
    name: Verify and plan the rollback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Require the trusted workflow ref
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "::error::Rollback must run from main" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the known-good target and build the plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_TAG: ${{ inputs.target_version }}
          BAD_TAG: ${{ inputs.bad_version }}
          RECORDED_ALIASES: ${{ inputs.recorded_aliases }}
          STAGING_RUN: ${{ inputs.staging_run }}
        run: |
          set -euo pipefail
          node scripts/rollback.mjs plan rollback-plan.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rollback-plan
          path: rollback-plan.json
          if-no-files-found: error
          retention-days: 7

  apply:
    name: Apply the rollback
    needs: plan
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rollback-plan
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Apply the verified plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/rollback.mjs apply rollback-plan.json
