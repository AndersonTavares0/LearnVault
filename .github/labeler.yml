# actions/labeler rules to classify pull requests by the files changed.
# Documentation: docs/governance/overview.md (section "Automatic labels").
#
# Explicit limits of this automation:
# - It is informational: it labels the pull request; it does not approve, does not block merge and is not a
#   required check.
# - It does not classify the type of work (`bug`, `enhancement`, `documentation`) nor security;
#   those categories remain human decisions.
# - The workflow uses `sync-labels: false`: no label is removed automatically.
# - The configuration is read from the trusted base (`pull_request_target`, no checkout).
#
# Every label referenced here must exist in the repository before the first run:
# the workflow has only `pull-requests: write`, does not create labels and fails when trying to apply
# a label that does not exist.

# --- Areas affected (zero or several per pull request) ---

# SPA React 19 + Vite.
"area:web":
  - changed-files:
      - any-glob-to-any-file: 'apps/web-next/**'

# Rust workspace (core, server, desktop) and the toolchain manifest.
# `crates/core` is shared: the automation does not treat it as server or desktop.
"area:rust":
  - changed-files:
      - any-glob-to-any-file:
          - 'crates/**'
          - 'Cargo.toml'
          - 'Cargo.lock'
          - 'rust-toolchain.toml'

# Aplicativo Tauri; muda junto com o Rust e recebe `area:rust` e `area:desktop`.
"area:desktop":
  - changed-files:
      - any-glob-to-any-file: 'crates/desktop/**'


# Documentation and repository policy. No generic `**/*.md`: explicit paths only.
"area:docs":
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - 'README.md'
          - 'AGENTS.md'
          - '.agents/**'
          - '.github/CONTRIBUTING.md'
          - '.github/CODE_OF_CONDUCT.md'
          - '.github/SECURITY.md'

# GitHub workflows, actions and automation configuration.
"area:ci":
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/labeler.yml'
          - '.github/dependabot.yml'
          - '.github/release-please/**'
          - '.github/ISSUE_TEMPLATE/**'
          - '.github/DISCUSSION_TEMPLATE/**'
          - '.github/pull_request_template.md'
          - '.github/CODEOWNERS'
          - 'scripts/**'

# OCI image, Compose, Quadlet and packaging.
"area:deploy":
  - changed-files:
      - any-glob-to-any-file:
          - 'deploy/**'
          - '.dockerignore'

# --- Tests and dependencies ---

# Test files detectable by path. Inline Rust unit tests
# (`#[cfg(test)]` inside `src/`) are not detectable and may not receive this label.
tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'crates/**/tests/**'
          - 'apps/web-next/src/**/*.test.ts?(x)'
          - 'tests/**'
          - 'testdata/**'

# Manifestos e lockfiles dos ecossistemas acompanhados pelo Dependabot.
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'Cargo.toml'
          - 'Cargo.lock'
          - 'package.json'
          - 'pnpm-lock.yaml'
          - 'pnpm-workspace.yaml'
          - 'apps/web-next/package.json'
