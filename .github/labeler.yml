# Regras do actions/labeler para classificar pull requests pelos arquivos alterados.
# Documentação: docs/governance/overview.md (seção "Labels automáticas").
#
# Limites explícitos desta automação:
# - É informacional: rotula a pull request; não aprova, não bloqueia merge e não é check
#   obrigatório.
# - Não classifica tipo de trabalho (`bug`, `enhancement`, `documentation`) nem segurança;
#   essas categorias continuam sendo decisões humanas.
# - O workflow usa `sync-labels: false`: nenhuma label é removida automaticamente.
# - A configuração é lida da base confiável (`pull_request_target`, sem checkout).
#
# Toda label referenciada aqui precisa existir no repositório antes da primeira execução:
# o workflow tem apenas `pull-requests: write`, não cria labels e falha ao tentar aplicar
# uma label inexistente.

# --- Áreas afetadas (zero ou várias por pull request) ---

# SPA Svelte 5 + Vite.
"area:web":
  - changed-files:
      - any-glob-to-any-file: 'apps/web/**'

# Espaço de trabalho Rust (core, server, desktop) e manifesto da toolchain.
# `crates/core` é compartilhado: a automação não o trata como servidor ou desktop.
"area:rust":
  - changed-files:
      - any-glob-to-any-file:
          - 'crates/**'
          - 'Cargo.toml'
          - 'Cargo.lock'
          - 'rust-toolchain.toml'

# Aplicativo Tauri; muda junto com o Rust e recebe `area:rust` e `area:desktop`.
"area:desktop":
  - changed-files:
      - any-glob-to-any-file: 'crates/desktop/**'


# Documentação e política do repositório. Sem `**/*.md` genérico: só caminhos explícitos.
"area:docs":
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - 'README.md'
          - 'AGENTS.md'
          - '.agents/**'
          - '.github/CONTRIBUTING.md'
          - '.github/CODE_OF_CONDUCT.md'
          - '.github/SECURITY.md'

# Workflows, ações e configuração de automação do GitHub.
"area:ci":
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/labeler.yml'
          - '.github/dependabot.yml'
          - '.github/release-please/**'
          - '.github/ISSUE_TEMPLATE/**'
          - '.github/DISCUSSION_TEMPLATE/**'
          - '.github/pull_request_template.md'
          - '.github/CODEOWNERS'
          - 'scripts/**'

# Imagem OCI, Compose, Quadlet e empacotamento.
"area:deploy":
  - changed-files:
      - any-glob-to-any-file:
          - 'deploy/**'
          - '.dockerignore'

# --- Testes e dependências ---

# Arquivos de teste detectáveis por caminho. Testes unitários inline em Rust
# (`#[cfg(test)]` dentro de `src/`) não são detectáveis e podem não receber esta label.
tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'crates/**/tests/**'
          - 'apps/web/src/**/*.test.ts'
          - 'tests/**'
          - 'testdata/**'

# Manifestos e lockfiles dos ecossistemas acompanhados pelo Dependabot.
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'Cargo.toml'
          - 'Cargo.lock'
          - 'package.json'
          - 'pnpm-lock.yaml'
          - 'pnpm-workspace.yaml'
          - 'apps/web/package.json'
