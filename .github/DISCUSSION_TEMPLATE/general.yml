title: "[Discussion] "
labels: ["discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Use the General category only when Ideas or Q&A do not fit.
        Product decisions belong in Ideas; technical questions belong in Q&A.
  - type: dropdown
    id: type
    attributes:
      label: Type of conversation
      options:
        - Communication
        - Feedback
        - Coordination
        - Other
    validations:
      required: true
  - type: textarea
    id: topic
    attributes:
      label: Topic
      description: Explain the subject of the conversation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Say whether the conversation should lead to a decision, an Issue or just information.
