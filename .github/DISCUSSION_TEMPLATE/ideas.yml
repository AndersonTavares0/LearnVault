title: "[Idea] "
labels: ["discussion", "idea"]
body:
  - type: markdown
    attributes:
      value: |
        Use this category for product proposals, priorities and scope decisions.
        For a technical question with no defined proposal, use the Q&A category.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What problem, opportunity or decision needs to be discussed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal or alternatives
      description: Describe the proposal and the alternatives considered.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Expected impact
      description: Explain the impact on users, the product and maintenance.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Expected decision
      description: What decision should come out of this Discussion?
    validations:
      required: true
