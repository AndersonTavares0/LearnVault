title: "[Question] "
labels: ["discussion", "question"]
body:
  - type: markdown
    attributes:
      value: |
        Use this category for technical and design questions.
        If there is already a clear implementation decision, open an Issue.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Ask a specific question and give the necessary context.
    validations:
      required: true
  - type: textarea
    id: explored
    attributes:
      label: What has already been explored
      description: Record attempts, alternatives or documentation consulted.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: List relevant requirements, risks or limits.
