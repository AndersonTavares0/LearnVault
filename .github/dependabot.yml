version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      frontend-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: gomod
    directory: /services/go
    schedule:
      interval: weekly
      day: wednesday
      time: "06:20"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      go-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: wednesday
      time: "06:40"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
    groups:
      actions-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "07:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      rust-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /deploy/container
    schedule:
      interval: weekly
      day: wednesday
      time: "07:20"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
    groups:
      docker-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: monthly
      day: wednesday
      time: "07:40"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
    groups:
      docker-compose-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
